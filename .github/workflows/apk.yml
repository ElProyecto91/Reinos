# Compila el APK de Reinos en los servidores de GitHub y, si la clave de firma está configurada,
# lo publica en "Releases" con su suma SHA-256.
#
# Seguridad (resumen; detalle en README.md):
#  - La clave de firma privada vive SOLO en los secretos de GitHub (ANDROID_KEYSTORE_B64 y
#    ANDROID_KEYSTORE_PASSWORD). Si faltan, se compila con una clave desechable y NO se publica nada.
#  - Build "release" (no depurable), con los permisos comprobados contra una lista cerrada.
#  - Godot y sus plantillas se verifican con SHA-512 fijados; las acciones de terceros van fijadas
#    por commit; el token del flujo es de solo lectura salvo para publicar la release.
name: APK Android

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "game = el juego (por defecto); isotest = APK aparte de prueba de rendimiento isométrica; isogame = el juego completo en isométrico como aplicación aparte"
        type: choice
        options: [game, isotest, isogame]
        default: game
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1"
  GODOT_ZIP_SHA512: ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e
  GODOT_TPZ_SHA512: 8f461c7d6e91a0fbabfc95b1e4ca70ff1732c6f2920956a16b086ec2a85b5f7e238baf4dbce60dcc5630fae3bcb9a1fa2ae2027b92cb495c02d082705715e441
  # Lista cerrada de permisos que puede pedir el APK (el flujo falla si aparece otro).
  ALLOWED_PERMISSIONS: "android.permission.VIBRATE android.permission.INTERNET android.permission.REQUEST_INSTALL_PACKAGES"

jobs:
  apk:
    runs-on: ubuntu-24.04   # fijo: 'latest' cambia de versión sin avisar
    timeout-minutes: 30
    permissions:
      contents: write   # solo se usa en el paso de publicar la release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes del SDK de Android
        run: |
          export SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "build-tools;35.0.1" "platforms;android-34" "platforms;android-35" "cmdline-tools;latest"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Descargar Godot y las plantillas (verificadas por SHA-512)
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -O "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -O "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_ZIP_SHA512}  Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" | sha512sum --check --strict
          echo "${GODOT_TPZ_SHA512}  Godot_v${GODOT_VERSION}-stable_export_templates.tpz" | sha512sum --check --strict
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p ~/.local/share/godot/export_templates tpl
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          rm -f Godot_v*.zip Godot_v*.tpz

      - name: Configurar Godot para Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT

      - name: Clave de firma (secreta; si falta, clave desechable y sin publicar)
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/reinos-release.p12"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            # Localiza la clave dentro de lo pegado (texto de más, líneas partidas...) y comprueba
            # que abre; si no abre, falla con un diagnóstico de la forma (sin revelar contenido).
            python3 .github/scripts/prepare_keystore.py "$ks"
          else
            pass="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
            echo "::add-mask::$pass"
            keytool -genkeypair -alias reinos -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 30 \
              -keystore "$ks" -storetype PKCS12 -storepass "$pass" -keypass "$pass" -dname "CN=Reinos desechable" > /dev/null
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass" >> "$GITHUB_ENV"
            echo "::warning title=Sin clave fija::faltan los secretos ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD. APK con clave desechable: NO se publica y no se podra actualizar encima de otro."
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=reinos" >> "$GITHUB_ENV"

      - name: Variante (juego o prueba de rendimiento isométrica)
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          INPUT_VARIANT: ${{ inputs.variant }}
        run: |
          # El juego es lo normal. La prueba isométrica (isotest/) sale como otra aplicación ("Reinos ISO", otro identificador de paquete)
          # que se instala al lado del juego sin tocarlo; se pide con "[iso-test]" en el mensaje del commit o con el selector de ejecución manual.
          variant=game
          if [ "$INPUT_VARIANT" = "isotest" ]; then variant=isotest; fi
          if [ "$INPUT_VARIANT" = "isogame" ]; then variant=isogame; fi
          case "$HEAD_MSG" in *"[iso-test]"*) variant=isotest ;; esac
          case "$HEAD_MSG" in *"[iso-game]"*) variant=isogame ;; esac
          echo "VARIANT=$variant" >> "$GITHUB_ENV"
          echo "::notice title=Variante::${variant}"
          if [ "$variant" = "isotest" ]; then
            sed -i 's#^run/main_scene=.*#run/main_scene="res://isotest/iso_bench.tscn"#' project.godot
            sed -i 's#^package/unique_name=.*#package/unique_name="com.reinos.isotest"#' export_presets.cfg
            sed -i 's#^package/name=.*#package/name="Reinos ISO"#' export_presets.cfg
            sed -i 's#, isotest/\*"#"#' export_presets.cfg
            grep -n "^run/main_scene" project.godot
            grep -n "^package/\(unique_name\|name\)\|^exclude_filter" export_presets.cfg
          fi
          if [ "$variant" = "isogame" ]; then
            # el juego completo en isométrico, con otro identificador de paquete: se instala al lado de «Reinos» sin tocarlo
            sed -i 's#^package/unique_name=.*#package/unique_name="com.reinos.iso"#' export_presets.cfg
            sed -i 's#^package/name=.*#package/name="Reinos ISO"#' export_presets.cfg
            grep -n "^package/\(unique_name\|name\)" export_presets.cfg
          fi

      - name: Número de versión (cada APK sube de versión y lo muestra el menú)
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          printf '{"build": "%s · %s"}\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA::7}" > data/build.json
          grep -n "^version" export_presets.cfg
          cat data/build.json

      - name: Plantilla de Android (compilación con Gradle y el instalador de actualizaciones)
        run: |
          # La plantilla de Godot (android_source.zip, ya descargada con las plantillas verificadas) se instala en android/build y se le
          # añade lo propio de android_extra/: el manifiesto (permiso REQUEST_INSTALL_PACKAGES y el componente) y InstallerPlugin.java.
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"
          test -f "$tpl"
          mkdir -p android/build
          unzip -q "$tpl" -d android/build
          printf '%s' "${GODOT_VERSION}.stable" > android/.build_version
          : > android/build/.gdignore
          cp android_extra/AndroidManifest.xml android/build/AndroidManifest.xml
          cp -r android_extra/src/. android/build/src/
          sed -i 's#^gradle_build/use_gradle_build=.*#gradle_build/use_gradle_build=true#' export_presets.cfg
          grep -n "use_gradle_build" export_presets.cfg
          # las bibliotecas nativas de Godot ya vienen sin símbolos: no hace falta el NDK
          echo "ORG_GRADLE_PROJECT_doNotStrip=true" >> "$GITHUB_ENV"
          ls android/build android/build/src/com/*

      - name: Importar recursos y exportar (release)
        run: |
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-release "Android" build/reinos.apk
          ls -la build

      - name: Comprobar que el instalador de actualizaciones va dentro del APK
        run: |
          aapt2="$SDK/build-tools/35.0.1/aapt2"
          "$aapt2" dump xmltree --file AndroidManifest.xml build/reinos.apk > manifest.txt
          grep -E "uses-permission|plugin.v2|package=|versionCode|screenOrientation" manifest.txt | sed 's/^ */::notice title=Manifiesto::/' | head -20
          grep -q "org.godotengine.plugin.v2.ReinosInstaller" manifest.txt || { echo "::error title=Instalador::falta el componente en el manifiesto"; exit 1; }
          grep -q "android.permission.REQUEST_INSTALL_PACKAGES" manifest.txt || { echo "::error title=Instalador::falta el permiso de instalar"; exit 1; }
          unzip -p build/reinos.apk 'classes*.dex' | grep -aq "com/reinos/juego/InstallerPlugin" || { echo "::error title=Instalador::la clase no está en el APK"; exit 1; }
          echo "::notice title=Instalador::presente (manifiesto, permiso y clase)"

      - name: Comprobar que el APK no es depurable
        run: |
          aapt2="$SDK/build-tools/35.0.1/aapt2"
          "$aapt2" dump badging build/reinos.apk > badging.txt
          grep -E "^(package|sdkVersion|targetSdkVersion)" badging.txt | sed 's/^/::notice title=APK::/'
          if grep -q "application-debuggable" badging.txt; then
            echo "::error title=APK depurable::el APK tiene android:debuggable=true"
            exit 1
          fi

      - name: Comprobar permisos contra la lista cerrada
        run: |
          aapt2="$SDK/build-tools/35.0.1/aapt2"
          perms="$("$aapt2" dump permissions build/reinos.apk | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort -u | tr '\n' ' ')"
          echo "::notice title=Permisos del APK::${perms}"
          bad=""
          for p in $perms; do
            case " $ALLOWED_PERMISSIONS " in *" $p "*) ;; *) bad="$bad $p" ;; esac
          done
          if [ -n "$bad" ]; then
            echo "::error title=Permisos no permitidos::${bad}"
            exit 1
          fi

      - name: Verificar la firma y la clave esperada
        id: sig
        run: |
          out="$("$SDK/build-tools/35.0.1/apksigner" verify --verbose --print-certs build/reinos.apk)"
          fp="$(printf '%s\n' "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          echo "::notice title=Huella SHA-256 de la firma::${fp}"
          printf '%s\n' "$out" | grep -E "^Verified using" | sed 's/^/::notice title=Firma::/'
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.key.outputs.fixed }}" = "true" ]; then
            expected="$(tr -d ' \n' < .github/signing-cert.sha256)"
            if [ "$fp" != "$expected" ]; then
              echo "::error title=Clave de firma inesperada::la huella no coincide con .github/signing-cert.sha256"
              exit 1
            fi
          fi

      - name: Suma SHA-256 del APK
        run: |
          cd build
          sha256sum reinos.apk | tee reinos.apk.sha256

      - name: Subir artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.key.outputs.fixed == 'true' && 'reinos-apk' || 'reinos-apk-SIN-CLAVE-FIJA' }}
          path: |
            build/reinos.apk
            build/reinos.apk.sha256

      - name: Publicar release del juego (solo con clave fija y desde main)
        if: steps.key.outputs.fixed == 'true' && github.ref == 'refs/heads/main' && env.VARIANT == 'game'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" build/reinos.apk build/reinos.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "APK firmado con la clave del proyecto. Huella SHA-256 de la firma: ${{ steps.sig.outputs.fp }}"

      - name: "Publicar la prueba isométrica (versión preliminar, nunca la última ni sustituye al juego)"
        if: steps.key.outputs.fixed == 'true' && github.ref == 'refs/heads/main' && env.VARIANT == 'isotest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/reinos.apk build/reinos-iso-prueba.apk
          (cd build && sha256sum reinos-iso-prueba.apk > reinos-iso-prueba.apk.sha256)
          gh release create "iso-test-${GITHUB_RUN_NUMBER}" build/reinos-iso-prueba.apk build/reinos-iso-prueba.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Prueba isométrica ${GITHUB_RUN_NUMBER}" \
            --notes "Prueba de rendimiento del estilo isométrico (no es el juego). Se instala como otra aplicación, 'Reinos ISO'. Huella SHA-256 de la firma: ${{ steps.sig.outputs.fp }}"

      - name: "Publicar el juego isométrico (versión preliminar, nunca la última ni sustituye al juego)"
        if: steps.key.outputs.fixed == 'true' && github.ref == 'refs/heads/main' && env.VARIANT == 'isogame'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/reinos.apk build/reinos-iso.apk
          (cd build && sha256sum reinos-iso.apk > reinos-iso.apk.sha256)
          gh release create "iso-${GITHUB_RUN_NUMBER}" build/reinos-iso.apk build/reinos-iso.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Reinos ISO ${GITHUB_RUN_NUMBER}" \
            --notes "El juego completo en estilo isométrico (en pruebas). Se instala como otra aplicación, 'Reinos ISO', al lado de Reinos. Huella SHA-256 de la firma: ${{ steps.sig.outputs.fp }}"
