# Genera un APK de Reinos en los servidores de GitHub (gratis para repositorios públicos
# y con cuota mensual gratuita para privados). SIN PROBAR: se escribió sin poder ejecutarlo.
# Uso: sube el proyecto a un repositorio de GitHub -> pestaña Actions -> "APK Android" -> Run workflow.
# El APK aparece al final como "artifact" (reinos-apk). Es un APK de depuración firmado con la clave
# de depuración fija de .github/reinos-debug.p12 (contraseña "android", pública a propósito): así cada
# APK nuevo se instala ENCIMA del anterior sin desinstalar. No sirve para Google Play.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.4.1"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes del SDK de Android
        run: |
          export SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Descargar Godot y las plantillas de exportación
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p ~/.local/share/godot/export_templates tpl
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Configurar Godot para Android
        run: |
          mkdir -p ~/.config/godot
          cp .github/reinos-debug.p12 "$HOME/debug.keystore"
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Número de versión (cada APK sube de versión y lo muestra el menú)
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          printf '{"build": "%s · %s"}\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA::7}" > data/build.json
          grep -n "^version" export_presets.cfg; cat data/build.json

      - name: Importar recursos y exportar
        run: |
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/reinos.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: reinos-apk
          path: build/reinos.apk
